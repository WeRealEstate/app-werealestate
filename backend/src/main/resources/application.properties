spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/werealestate}
spring.datasource.username=${DB_USER:werealestate}
spring.datasource.password=${DB_PASSWORD:werealestate}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion-debe-medir-al-menos-32-caracteres}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Captcha (Cloudflare Turnstile) en el login, contra fuerza bruta. Desactivado por defecto (dev/test
# no necesitan llaves reales); en el VPS se activa con TURNSTILE_ENABLED=true + TURNSTILE_SECRET_KEY.
app.turnstile.enabled=${TURNSTILE_ENABLED:false}
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

app.lead.dias-frio=${LEAD_DIAS_FRIO:15}
# Regla 1: un lead sin ningún seguimiento registrado se marca "sin contactar" pasado este umbral.
app.lead.dias-sin-contactar-nuevo=${LEAD_DIAS_SIN_CONTACTAR:7}

# Un lote en APARTADO (el estado simple) regresa solo a DISPONIBLE si nadie lo cambia en este plazo.
app.lote.dias-apartado-expira=${LOTE_DIAS_APARTADO_EXPIRA:3}

# Carpeta donde se guardan los planos subidos (ver DesarrolloService/WebConfig); en el VPS se debe
# apuntar a una ruta persistente fuera del directorio del jar.
app.uploads.dir=${UPLOADS_DIR:uploads}

# Carpeta APARTE de la anterior para archivos que no deben ser públicos (por ahora, los tickets de
# Gasto): a diferencia de uploads/, esta nunca se sirve como estático — solo se lee desde el
# backend, detrás de autenticación (ver GastoService/GastoController). En el VPS, igual que
# UPLOADS_DIR, conviene apuntarla a una ruta persistente fuera del directorio del jar.
app.uploads-privados.dir=${UPLOADS_PRIVADOS_DIR:uploads-privados}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Google Drive para los archivos de Registrar venta (ver DriveService). Sin las tres, la integración queda apagada.
# En el servidor van por variables de entorno (el repositorio es público). En desarrollo local pueden ir en
# backend/google-drive.local.properties (ignorado por git); si no existe, no pasa nada.
spring.config.import=optional:file:./google-drive.local.properties
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.drive-redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:}
# Clave de API (del navegador, restringida al dominio) para el selector de Google con el que se elige la carpeta.
app.google.picker-api-key=${GOOGLE_PICKER_API_KEY:}
# Va en las etiquetas internas de carpetas y archivos: "local" en desarrollo, para que pruebas y producción en la misma
# cuenta de Google nunca se confundan.
app.google.drive-entorno=${GOOGLE_DRIVE_ENTORNO:produccion}
