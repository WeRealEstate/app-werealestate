<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Título y vista previa al compartir el link (WhatsApp no ejecuta JS). scripts/paginas-publicas.mjs
       reemplaza este bloque por el de cada página pública al compilar. -->
  <!-- vista-previa:inicio -->
  <title>We Real Estate</title>
  <meta name="description" content="We Real Estate: desarrollos inmobiliarios en Oaxaca">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="We Real Estate">
  <meta property="og:title" content="We Real Estate">
  <meta property="og:description" content="We Real Estate: desarrollos inmobiliarios en Oaxaca">
  <meta property="og:image" content="https://app.weinversiones.com/images/we-logo-color.png">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="259">
  <meta name="twitter:card" content="summary">
  <!-- vista-previa:fin -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b132b">
  <script>try{var d=localStorage.getItem("we_theme")==="dark";if(d)document.documentElement.classList.add("dark");var m=document.querySelector('meta[name="theme-color"]');if(m&&matchMedia("(min-width:1024px)").matches)m.content=d?"#0f172a":"#f7f9ff"}catch(e){}</script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="We">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fuentes de Google sin bloquear el primer pintado: la hoja se pide como "print" (no bloquea) y al llegar se
       activa; mientras tanto se ve la fuente del sistema (font-display: swap). Sin JS, el noscript la carga normal. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Jost:wght@300&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Jost:wght@300&display=swap" rel="stylesheet"></noscript>
  <!-- El script de Cloudflare Turnstile (captcha) ya no está aquí: solo lo necesita /login, que lo carga por su cuenta. -->
</head>
<body>
  <app-root></app-root>

    <!-- Pantalla de carga inicial (se reemplaza cuando arranca la app) -->
    <style>
      .we-splash{position:fixed;inset:0;z-index:9999;transition:opacity .35s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;background:radial-gradient(90% 80% at 50% 40%,#fff 0%,#eef2f8 75%)}
      html.dark .we-splash{background:radial-gradient(90% 80% at 50% 40%,#1f2c47 0%,#111a2c 72%)}
      .we-splash .l{position:relative;width:min(230px,58vw);aspect-ratio:600/259}
      .we-splash .l::before{content:"";position:absolute;inset:-60% -40%;background:radial-gradient(closest-side,rgba(133,180,240,.28),transparent);filter:blur(8px)}
      html.dark .we-splash .l::before{background:radial-gradient(closest-side,rgba(133,180,240,.22),transparent)}
      .we-splash .l div{position:absolute;inset:0}
      .we-splash img{position:absolute;inset:0;width:100%;height:100%}
      .we-splash .b{-webkit-mask-image:radial-gradient(ellipse 22.4% 50.5% at 77.5% 50%,transparent 99%,#000 100%);mask-image:radial-gradient(ellipse 22.4% 50.5% at 77.5% 50%,transparent 99%,#000 100%)}
      .we-splash .e{clip-path:ellipse(22.4% 50.5% at 77.5% 50%);transform-origin:77.5% 50%;animation:ws 1.8s cubic-bezier(.7,0,.3,1) infinite}
      .we-splash .d{display:flex;gap:8px}.we-splash .d i{width:7px;height:7px;border-radius:50%;background:#2740b8;animation:wd 1.8s ease-in-out infinite}
      html.dark .we-splash .d i{background:#85b4f0}
      .we-splash .d i:nth-child(2){animation-delay:.2s}.we-splash .d i:nth-child(3){animation-delay:.4s}
      .we-splash .dk{display:none}html.dark .we-splash .dk{display:block}html.dark .we-splash .lt{display:none}
      .we-splash-salir{opacity:0;pointer-events:none}
      @keyframes ws{0%{transform:rotate(0)}65%,100%{transform:rotate(360deg)}}
      @keyframes wd{0%,40%,100%{transform:translateY(0);opacity:.35}20%{transform:translateY(-6px);opacity:1}}
    </style>
    <script>
    // Primer pantallazo de cada desarrollo (en vez del de We): el plano público de SAMAI / Nanuu y los
    // registros de venta que traen ?proyecto=. El CSS (.dl-*) está en styles.css; app-desarrollo-loader retoma
    // la animación en la misma fase cuando arranca la app.
    (function(){
      var p=location.pathname,d=null,tema=null;
      // Los planos públicos (/samai, /aldea-nanuu) no llevan pantalla de carga: se ve negro hasta que llega el plano
      // y entonces se revela (ver plano-publico). Sin esto saldría el pantallazo genérico de We.
      if(/^\/(samai|aldea-nanuu)(\/|$)/.test(p)){
        document.documentElement.style.background='#000';document.write('<style>#we-splash{display:none!important}body{background:#000}</style>');
        // Los lotes se piden desde ya, mientras se descarga el JavaScript (la imagen del plano no puede empezar antes de que
        // llegue esta respuesta, que trae su URL). LotesService.listarPublicoPorProyecto la recoge una sola vez; si falla o
        // tarda demasiado, la app hace la petición normal. Lleva el mismo token que el interceptor: con sesión, el admin
        // ve el estado real de los lotes y no el que se muestra al público.
        try{
          var proy=/^\/aldea-nanuu/.test(p)?'nanuu':'samai',tk=localStorage.getItem('we_auth_token'),h={Accept:'application/json'};
          if(tk)h.Authorization='Bearer '+tk;
          window.__lotesPrecargados={proyecto:proy,desde:Date.now(),promesa:fetch('/api/lotes/publico?proyecto='+proy,{headers:h}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
            // En cuanto se sabe cuál es el plano, su descarga (lo más pesado) arranca sin esperar a que la app esté lista.
            var u=d&&d[0]&&d[0].desarrollo&&d[0].desarrollo.planoUrl;
            if(u){var l=document.createElement('link');l.rel='preload';l.as='image';l.href=u;l.setAttribute('fetchpriority','high');document.head.appendChild(l)}
            return d})};
          window.__lotesPrecargados.promesa.catch(function(){});
        }catch(e){}
        return}
      if(/^\/we-forms(\/|$)/.test(p)){var q=new URLSearchParams(location.search).get('proyecto');if(q==='samai'||q==='nanuu')d=q}
      if(!d)return;
      if(tema)document.documentElement.style.background='#000';
      document.write('<style>#we-splash{display:none!important}'+(tema?'body{background:#000}':'')+'</style>');
      var m=d==='samai'
        ?'<div class="dl-s-emblem"></div><div class="dl-s-word"></div><div class="dl-s-sub">CAMPESTRE</div><div class="dl-s-line"></div>'
        :'<div class="dl-n-logo"><div class="dl-n-aldea"></div><div class="dl-n-word"></div><div class="dl-n-leaf"></div><div class="dl-n-eco"></div></div>';
      document.write('<div id="dev-splash" class="dl dl-'+d+' dl--pantalla"'+(tema?' data-tema="'+tema+'"':'')+' role="status" aria-label="Cargando">'+m+'</div>');
    })();
    </script>
    <div id="we-splash" class="we-splash" role="status" aria-label="Cargando">
      <div class="l">
        <div class="lt"><img class="b" src="/images/we-logo-color.png" alt=""><img class="e" src="/images/we-logo-color.png" alt=""></div>
        <div class="dk"><img class="b" src="/images/we-logo.png" alt=""><img class="e" src="/images/we-logo.png" alt=""></div>
      </div>
      <div class="d"><i></i><i></i><i></i></div>
    </div>
  
</body>
</html>
