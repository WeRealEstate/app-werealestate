<form (submit)="$event.preventDefault(); confirmar()" class="w-full max-w-sm rounded-xl border border-border bg-surface p-6 shadow-lg" data-testid="pin-gate">
  <h2 class="font-heading text-lg font-semibold text-ink">{{ titulo() }}</h2>
  <p class="mt-2 text-sm text-ink-muted">{{ texto() }}</p>
  <div data-pin class="mt-5 flex justify-center gap-3">
    @for (i of [0, 1, 2, 3]; track i) {
      <input
        type="text"
        [name]="'pin' + i"
        [attr.aria-label]="'Carácter ' + (i + 1) + ' del PIN'"
        [value]="casillas()[i]"
        (input)="escribir(i, $any($event.target).value, $event)"
        (keydown)="tecla(i, $event)"
        (focus)="$any($event.target).select()"
        placeholder="*"
        maxlength="4"
        autocomplete="off"
        autocapitalize="characters"
        class="h-14 w-14 rounded-lg border border-border bg-surface text-center font-mono text-2xl uppercase text-ink outline-none transition-all
               placeholder:text-ink-muted focus:border-we-primary focus:ring-2 focus:ring-we-primary/50"
      />
    }
  </div>
  @if (error(); as e) {
    <p class="mt-3 text-center text-sm text-red-600 dark:text-red-400" role="alert" data-testid="pin-error">{{ e }}</p>
  }
  <button
    type="submit"
    [disabled]="pin().length !== 4 || cargando()"
    class="mt-5 w-full rounded-lg bg-we-primary px-4 py-3 text-sm font-semibold text-white hover:bg-we-primary/90 disabled:opacity-60 disabled:cursor-not-allowed min-h-[44px]"
  >
    {{ cargando() ? 'Verificando…' : 'Entrar' }}
  </button>
</form>
