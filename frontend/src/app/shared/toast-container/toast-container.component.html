<div class="pointer-events-none fixed inset-x-0 bottom-0 z-50 flex flex-col items-center gap-2 p-4 sm:items-end sm:p-6" aria-live="polite">
  @for (t of toastService.toasts(); track t.id) {
    <div
      role="status"
      class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl border px-4 py-3 shadow-lg backdrop-blur-sm"
      [class.toast-enter]="!t.exiting"
      [class.toast-exit]="t.exiting"
      [class.bg-green-50]="t.type === 'success'"
      [class.border-green-200]="t.type === 'success'"
      [class.dark:bg-green-500/10]="t.type === 'success'"
      [class.dark:border-green-500/25]="t.type === 'success'"
      [class.bg-red-50]="t.type === 'error'"
      [class.border-red-200]="t.type === 'error'"
      [class.dark:bg-red-500/10]="t.type === 'error'"
      [class.dark:border-red-500/25]="t.type === 'error'"
    >
      @if (t.type === 'success') {
        <svg class="mt-0.5 h-5 w-5 shrink-0 text-green-600 dark:text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M8 12.5l2.5 2.5L16 9.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      } @else {
        <svg class="mt-0.5 h-5 w-5 shrink-0 text-red-600 dark:text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v5M12 16h.01" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
      <p class="flex-1 text-sm font-medium" [class.text-green-800]="t.type === 'success'" [class.dark:text-green-200]="t.type === 'success'" [class.text-red-800]="t.type === 'error'" [class.dark:text-red-200]="t.type === 'error'">
        {{ t.message }}
      </p>
      <button
        type="button"
        (click)="dismiss(t.id)"
        class="shrink-0 text-ink-muted hover:text-ink active:scale-[0.9]"
        aria-label="Cerrar notificación"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  }
</div>
