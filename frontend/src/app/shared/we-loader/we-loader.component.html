<div [class]="clases()" role="status" aria-live="polite">
  <div class="relative" [style.width.px]="ancho()" style="aspect-ratio: 600 / 259" aria-hidden="true">
    <!-- Tema claro: logo con la W azul -->
    <div class="absolute inset-0 dark:hidden">
      <img src="/images/we-logo-color.png" alt="" class="we-logo-base" />
      <img src="/images/we-logo-color.png" alt="" class="we-logo-e" />
    </div>
    <!-- Tema oscuro: logo con la W blanca -->
    <div class="absolute inset-0 hidden dark:block">
      <img src="/images/we-logo.png" alt="" class="we-logo-base" />
      <img src="/images/we-logo.png" alt="" class="we-logo-e" />
    </div>
  </div>
  <div class="flex gap-2" aria-hidden="true">
    <span class="we-dot"></span>
    <span class="we-dot" style="animation-delay: 0.2s"></span>
    <span class="we-dot" style="animation-delay: 0.4s"></span>
  </div>
  <span class="sr-only">{{ texto() }}</span>
</div>
