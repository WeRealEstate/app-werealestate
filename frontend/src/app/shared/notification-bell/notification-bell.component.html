<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="relative flex h-9 w-9 items-center justify-center rounded-lg text-white/80 hover:bg-white/10
           transition-transform duration-150 active:scale-90 focus:outline-none focus:ring-2 focus:ring-white/40"
    [attr.aria-label]="total() > 0 ? total() + ' notificaciones pendientes' : 'Sin notificaciones'"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    @if (total() > 0) {
      <span class="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-semibold text-white">
        {{ total() > 9 ? '9+' : total() }}
      </span>
    }
  </button>

  @if (isOpen()) {
    <button type="button" (click)="close()" class="fixed inset-0 z-30" aria-label="Cerrar notificaciones"></button>

    <div class="toast-enter absolute left-0 z-40 mt-2 w-80 max-w-[85vw] rounded-xl border border-border bg-surface shadow-2xl">
      <div class="border-b border-border px-4 py-3">
        <h3 class="font-heading text-sm font-semibold text-ink">Notificaciones</h3>
      </div>
      <div class="max-h-80 overflow-y-auto">
        @if (notificaciones().length === 0) {
          <p class="px-4 py-6 text-center text-sm text-ink-muted">Estás al día, no hay pendientes.</p>
        } @else {
          @for (n of notificaciones(); track $index) {
            <a
              [routerLink]="rutaDeNotificacion(n)"
              (click)="close()"
              class="flex items-start gap-2.5 border-b border-border px-4 py-3 text-sm last:border-b-0 hover:bg-surface-2 transition-colors duration-150"
            >
              <span
                class="mt-1 h-2 w-2 shrink-0 rounded-full"
                [class.bg-red-500]="n.tipo === 'LEAD_FRIO'"
                [class.bg-amber-500]="n.tipo === 'SEGUIMIENTO_PENDIENTE'"
                [class.bg-we-blue-light]="n.tipo === 'TAREA_PENDIENTE'"
                aria-hidden="true"
              ></span>
              <span class="text-ink">{{ n.mensaje }}</span>
            </a>
          }
        }
      </div>
    </div>
  }
</div>
