<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="relative flex h-9 w-9 items-center justify-center rounded-lg text-white/80 hover:bg-white/10
           transition-transform duration-150 active:scale-90 focus:outline-none focus:ring-2 focus:ring-white/40"
    [attr.aria-label]="total() > 0 ? total() + ' notificaciones pendientes' : 'Sin notificaciones'"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    @if (total() > 0) {
      <span class="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-600 px-1 text-[10px] font-semibold text-white">
        {{ total() > 9 ? '9+' : total() }}
      </span>
    }
  </button>

  @if (isOpen()) {
    <button type="button" (click)="close()" class="fixed inset-0 z-30" aria-label="Cerrar notificaciones"></button>

    <!-- El trigger vive cerca del borde derecho de un sidebar de 256px: un panel de 320px
         anclado a su x (izquierda o derecha) se sale del viewport en cualquier pantalla angosta,
         porque ninguno de los dos lados tiene 320px libres ahí. Por debajo de lg (donde el sidebar
         es un drawer superpuesto, no una columna fija) se ancla al viewport en vez de al trigger;
         de lg en adelante hay sobra de espacio a la derecha y vuelve al dropdown normal. -->
    <div
      class="toast-enter fixed inset-x-4 top-20 z-40 rounded-xl border border-border bg-surface shadow-2xl
             lg:absolute lg:inset-x-auto lg:top-auto lg:left-0 lg:mt-2 lg:w-80 lg:max-w-[85vw]"
    >
      <div class="border-b border-border px-4 py-3">
        <h3 class="font-heading text-sm font-semibold text-ink">Notificaciones</h3>
      </div>
      <div class="max-h-80 overflow-y-auto">
        @if (notificaciones().length === 0) {
          <p class="px-4 py-6 text-center text-sm text-ink-muted">Estás al día, no hay pendientes.</p>
        } @else {
          @for (n of notificaciones(); track $index) {
            <a
              [routerLink]="rutaDeNotificacion(n)"
              (click)="alNavegar($index)"
              class="group flex items-start gap-2.5 border-b border-border px-4 py-3 text-sm last:border-b-0 hover:bg-surface-2 transition-colors duration-150"
            >
              <span
                class="mt-1 h-2 w-2 shrink-0 rounded-full"
                [class.bg-red-500]="n.tipo === 'LEAD_FRIO'"
                [class.bg-orange-600]="n.tipo === 'LEAD_SIN_CONTACTAR'"
                [class.bg-amber-500]="n.tipo === 'SEGUIMIENTO_PENDIENTE'"
                [class.bg-we-blue-light]="n.tipo === 'TAREA_PENDIENTE'"
                [class.bg-purple-500]="n.tipo === 'EVENTO_PENDIENTE'"
                aria-hidden="true"
              ></span>
              <span class="flex-1 text-ink">{{ n.mensaje }}</span>
              <button
                type="button"
                (click)="eliminar($index, $event)"
                aria-label="Eliminar notificación"
                class="shrink-0 rounded p-0.5 text-ink-muted opacity-0 hover:text-red-600 group-hover:opacity-100 focus:opacity-100 transition-opacity duration-150"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </a>
          }
        }
      </div>
    </div>
  }
</div>
