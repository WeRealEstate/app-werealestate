<button
  type="button"
  [attr.aria-pressed]="themeService.theme() === 'dark'"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Modo oscuro activado, cambiar a modo claro' : 'Modo claro activado, cambiar a modo oscuro'"
  [attr.title]="themeService.theme() === 'dark' ? 'Modo oscuro — cambiar a claro' : 'Modo claro — cambiar a oscuro'"
  (click)="toggle()"
  class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-white/20 text-white/70
         hover:border-white/40 hover:text-white transition-[color,border-color,transform] duration-150 active:scale-90
         focus:outline-none focus:ring-2 focus:ring-white/40"
>
  @if (themeService.theme() === 'dark') {
    <!-- Luna: modo oscuro activo -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
      <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/>
    </svg>
  } @else {
    <!-- Sol: modo claro activo -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-linecap="round"/>
    </svg>
  }
</button>
