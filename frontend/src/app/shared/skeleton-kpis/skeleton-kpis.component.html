<div [class]="columnas()" role="status" aria-live="polite">
  @for (t of tarjetas(); track t) {
    <div class="flex flex-col gap-3.5 rounded-2xl border border-border bg-surface p-5 shadow-sm">
      <div class="flex items-center justify-between">
        <div class="we-skeleton h-3.5 w-1/2 rounded"></div>
        <div class="we-e-mini" aria-hidden="true">
          <img src="/images/we-logo.png" alt="" />
        </div>
      </div>
      <div class="we-skeleton h-6 w-[55%] rounded-md"></div>
      <div class="we-skeleton h-3 w-[35%] rounded"></div>
      @if (conGrafica()) {
        <div class="flex h-14 items-end gap-2 pt-1.5" aria-hidden="true">
          @for (b of barras; track $index) {
            <div class="flex-1" [style.height.%]="b"><div class="we-skeleton h-full w-full rounded"></div></div>
          }
        </div>
      }
    </div>
  }
  <span class="sr-only">Cargando…</span>
</div>
