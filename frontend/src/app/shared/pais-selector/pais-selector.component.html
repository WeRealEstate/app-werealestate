<div class="relative">
  <input
    [id]="inputId()" type="text" role="combobox" autocomplete="off" [placeholder]="placeholder()"
    [attr.aria-expanded]="abierto()" aria-autocomplete="list"
    [value]="texto()" [disabled]="deshabilitado()"
    (input)="escribir($any($event.target).value)" (focus)="abrir()" (blur)="cerrar()" (keydown)="teclado($event)"
    [class.border-red-500]="invalido()" [class.border-border]="!invalido()"
    class="block w-full rounded-lg border bg-surface px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-we-primary/50 focus:border-we-primary disabled:opacity-60"
  />
  @if (abierto()) {
    <ul role="listbox" class="absolute z-30 mt-1 max-h-60 w-full overflow-y-auto rounded-lg border border-border bg-surface py-1 shadow-lg">
      @for (p of opciones(); track p; let i = $index) {
        <li
          role="option" [attr.aria-selected]="p === valor()" (mousedown)="elegir(p); $event.preventDefault()"
          [class.bg-surface-2]="i === resaltado()" [class.font-semibold]="p === valor()"
          class="cursor-pointer px-3.5 py-2 text-sm text-ink hover:bg-surface-2"
        >{{ p }}</li>
      } @empty {
        <li class="px-3.5 py-2.5 text-sm text-ink-muted">Sin coincidencias.</li>
      }
    </ul>
  }
</div>
