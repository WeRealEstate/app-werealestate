<!-- Portada del cotizador público, al estilo de una página de producto de Apple: la foto a todo lo ancho,
     un título corto centrado y dos caminos (cotizar o ver un plano). Al bajar, la foto se acerca y se
     oscurece mientras el texto se desvanece, como transición hacia el formulario (ver hero-publico.ts). -->
<section #hero class="relative h-[100svh] min-h-[560px] overflow-hidden bg-black text-white">
  <div #fotoMarco class="absolute inset-0 will-change-transform">
    <img
      #foto
      src="/images/cotizador-hero.png"
      alt=""
      fetchpriority="high"
      class="h-full w-full object-cover object-[62%_center] sm:object-center"
    />
  </div>

  <!-- Velo para leer el texto blanco sobre la foto; abajo se oscurece un poco más para la flecha. -->
  <div class="absolute inset-0 bg-black/40" aria-hidden="true"></div>
  <div class="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-black/45 to-transparent" aria-hidden="true"></div>
  <!-- Se va oscureciendo al bajar (scroll), hasta fundirse con el formulario. -->
  <div #veloScroll class="absolute inset-0 bg-black opacity-0" aria-hidden="true"></div>

  <div
    #contenido
    class="relative z-10 mx-auto flex h-full max-w-4xl flex-col items-center justify-center px-6 pt-[calc(3.25rem+env(safe-area-inset-top))] text-center"
  >
    <h1 class="hero-item font-heading text-[clamp(3rem,10vw,6rem)] font-semibold leading-[1.02] tracking-[-0.035em]">
      Cotizador We
    </h1>
    <p
      class="hero-item mt-4 max-w-2xl text-balance text-[clamp(1.25rem,2.8vw,1.75rem)] font-medium leading-snug tracking-[-0.012em] text-white/85"
    >
      SAMAI Campestre y Aldea Nanuu, cotizados en minutos.
    </p>

    <div class="hero-item mt-10 flex flex-col items-center gap-6 sm:flex-row sm:gap-8">
      <button
        type="button"
        (click)="irAlCotizador()"
        class="rounded-full bg-we-primary px-7 py-3.5 text-[17px] font-medium text-white shadow-[0_8px_24px_-8px_rgba(0,0,0,0.6)]
               transition-[background-color,transform] duration-200 hover:bg-[#2f50d9] active:scale-[0.97]
               focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-black/40"
      >
        Comenzar cotización
      </button>
      <div class="flex items-center gap-6 text-[17px]">
        <a
          routerLink="/samai"
          class="group inline-flex items-center gap-0.5 rounded text-white underline-offset-4 hover:underline
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
        >
          Plano Samai
          <svg lucideChevronRight [size]="18" class="transition-transform duration-200 group-hover:translate-x-0.5" aria-hidden="true"></svg>
        </a>
        <a
          routerLink="/aldea-nanuu"
          class="group inline-flex items-center gap-0.5 rounded text-white underline-offset-4 hover:underline
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
        >
          Plano Aldea Nanuu
          <svg lucideChevronRight [size]="18" class="transition-transform duration-200 group-hover:translate-x-0.5" aria-hidden="true"></svg>
        </a>
      </div>
    </div>
  </div>

  <button
    #flecha
    type="button"
    (click)="irAlCotizador()"
    aria-label="Ir al formulario de cotización"
    class="absolute bottom-[max(1.25rem,env(safe-area-inset-bottom))] left-1/2 z-10 -translate-x-1/2 rounded-full p-2 text-white/70
           transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
  >
    <svg lucideChevronDown [size]="28" aria-hidden="true"></svg>
  </button>
</section>
