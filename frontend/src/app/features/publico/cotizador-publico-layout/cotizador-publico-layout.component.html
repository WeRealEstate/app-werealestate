<div class="flex min-h-dvh flex-col bg-canvas pb-[env(safe-area-inset-bottom)]">
  <!-- Barra fija estilo Apple: transparente sobre la foto de la portada y translúcida (vidrio esmerilado)
       en cuanto el contenido pasa por debajo, para que se lea sobre cualquier fondo. -->
  <header
    id="barra-publica"
    class="fixed inset-x-0 top-0 z-40 border-b pt-[env(safe-area-inset-top)] transition-[background-color,border-color] duration-300"
    [class.border-transparent]="sobreHero()"
    [class.barra-vidrio]="!sobreHero()"
  >
    <div class="mx-auto flex h-13 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-10">
      <a
        routerLink="/cotizador-publico"
        class="flex items-center gap-3 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-we-primary/50"
      >
        <img
          src="/images/we-logo-color.png"
          alt="We Real Estate"
          class="h-7 w-auto dark:hidden"
          [class.hidden]="sobreHero()"
          width="65"
          height="28"
        />
        <img
          src="/images/we-logo.png"
          alt=""
          aria-hidden="true"
          class="h-7 w-auto dark:block"
          [class.hidden]="!sobreHero()"
          width="65"
          height="28"
        />
        <span
          class="hidden text-sm font-medium tracking-[-0.01em] transition-colors duration-300 sm:inline"
          [class.text-white]="sobreHero()"
          [class.text-ink]="!sobreHero()"
        >
          Cotizador
        </span>
      </a>

      <nav aria-label="Planos y score de ventas" class="-mr-2.5 flex items-center text-[13px] font-medium sm:text-sm">
        <a
          routerLink="/samai"
          class="inline-flex min-h-[44px] items-center gap-1.5 rounded-lg px-2.5 transition-colors duration-300
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-we-primary/50"
          [class.text-white/85]="sobreHero()"
          [class.hover:text-white]="sobreHero()"
          [class.text-ink-muted]="!sobreHero()"
          [class.hover:text-ink]="!sobreHero()"
        >
          <svg lucideMap [size]="15" aria-hidden="true"></svg>
          <span class="sm:hidden">Samai</span><span class="hidden sm:inline">Plano Samai</span>
        </a>
        <a
          routerLink="/aldea-nanuu"
          class="inline-flex min-h-[44px] items-center gap-1.5 rounded-lg px-2.5 transition-colors duration-300
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-we-primary/50"
          [class.text-white/85]="sobreHero()"
          [class.hover:text-white]="sobreHero()"
          [class.text-ink-muted]="!sobreHero()"
          [class.hover:text-ink]="!sobreHero()"
        >
          <svg lucideMap [size]="15" aria-hidden="true"></svg>
          <span class="sm:hidden">Nanuu</span><span class="hidden sm:inline">Plano Aldea Nanuu</span>
        </a>
        <a
          routerLink="/cotizador-publico/score"
          data-testid="enlace-score"
          class="inline-flex min-h-[44px] items-center gap-1.5 rounded-lg px-2.5 transition-colors duration-300
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-we-primary/50"
          [class.text-white/85]="sobreHero()"
          [class.hover:text-white]="sobreHero()"
          [class.text-ink-muted]="!sobreHero()"
          [class.hover:text-ink]="!sobreHero()"
        >
          <svg lucideTrophy [size]="15" aria-hidden="true"></svg>
          <span class="sm:hidden">Score</span><span class="hidden sm:inline">Score de ventas</span>
        </a>
      </nav>
    </div>
  </header>

  @if (conPortada()) {
    <app-hero-publico />
  } @else {
    <!-- Sin portada, el contenido arranca debajo de la barra fija. -->
    <div class="h-[calc(3.25rem+env(safe-area-inset-top))]" aria-hidden="true"></div>
  }

  <main id="cotizador" class="flex-1 p-4 sm:p-6 lg:p-10">
    <div class="mx-auto max-w-6xl">
      <router-outlet />
    </div>
  </main>

  <footer class="border-t border-border bg-surface-2">
    <div
      class="mx-auto flex max-w-6xl flex-col gap-1 px-4 py-6 text-center text-xs text-ink-muted sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-10"
    >
      <p>© {{ currentYear }} We Real Estate. Todos los derechos reservados.</p>
      <p>Cotizaciones sujetas a disponibilidad y condiciones vigentes.</p>
    </div>
  </footer>

  <app-toast-container />
  <app-confirm-dialog />
</div>
