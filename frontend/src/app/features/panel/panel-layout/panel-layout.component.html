<div class="relative min-h-screen w-full bg-we-dark font-body">
  <!-- Fondo de marca, fijo detrás de todo -->
  <div
    class="fixed inset-0 bg-cover bg-center"
    style="background-image: linear-gradient(160deg, #243fb86c 0%, #0b132b68 55%, #0b132b52 100%), url('/login-bg.png'); background-blend-mode: overlay;"
    aria-hidden="true"
  ></div>
  <div class="fixed inset-0 bg-we-dark/35" aria-hidden="true"></div>

  <!-- Overlay móvil al abrir el sidebar -->
  @if (sidebarOpen()) {
    <button
      type="button"
      (click)="closeSidebar()"
      class="fixed inset-0 z-20 bg-black/40 lg:hidden"
      aria-label="Cerrar menú"
    ></button>
  }

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-30 flex w-64 flex-col border-r border-white/15 bg-white/10 backdrop-blur-xl
           transition-transform duration-300 ease-out lg:translate-x-0"
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <div class="flex items-center gap-2.5 px-6 py-5">
      <div class="h-9 w-9 rounded-lg bg-white/15 border border-white/25 flex items-center justify-center">
        <span class="font-heading font-bold text-white text-sm">We</span>
      </div>
      <span class="font-heading font-semibold text-white text-sm">We Real Estate</span>
    </div>

    <nav class="mt-2 flex-1 space-y-1 px-3">
      @for (item of navItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-white/15 text-white"
          [routerLinkActiveOptions]="{ exact: item.route === '/panel/leads' ? false : true }"
          (click)="closeSidebar()"
          class="flex items-center gap-3 rounded-lg px-3.5 py-2.5 text-sm font-medium text-white/65
                 hover:bg-white/10 hover:text-white transition-colors focus:outline-none focus:ring-2 focus:ring-white/40"
        >
          @if (item.icon === 'home') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 12l9-9 9 9" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          }
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-white/15 px-4 py-4">
      <div class="flex items-center justify-between gap-3 px-1.5">
        <span class="text-xs font-medium text-white/60">Modo oscuro</span>
        <app-theme-toggle />
      </div>
    </div>

    @if (user(); as u) {
      <div class="border-t border-white/15 px-4 py-4">
        <div class="flex items-center gap-3 px-1.5">
          <div
            class="h-9 w-9 shrink-0 rounded-full bg-white/15 border border-white/25 flex items-center justify-center
                   font-heading font-semibold text-white text-sm"
            aria-hidden="true"
          >
            {{ u.nombre.charAt(0) }}
          </div>
          <div class="min-w-0 leading-tight">
            <p class="truncate text-sm font-medium text-white">{{ u.nombre }}</p>
            <p class="truncate text-xs text-white/55">{{ roleLabel() }}</p>
          </div>
        </div>
        <button
          type="button"
          (click)="logout()"
          class="mt-3 flex w-full items-center justify-center gap-2 rounded-lg border border-white/20 px-3 py-2 text-xs
                 font-medium text-white/70 hover:border-white/40 hover:text-white transition-colors
                 focus:outline-none focus:ring-2 focus:ring-white/40 min-h-[36px]"
        >
          Cerrar sesión
        </button>
      </div>
    }
  </aside>

  <!-- Top bar móvil -->
  <div class="sticky top-0 z-10 flex items-center gap-3 border-b border-white/15 bg-we-dark/50 px-4 py-3 backdrop-blur-xl lg:hidden">
    <button
      type="button"
      (click)="toggleSidebar()"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-white/80 hover:bg-white/10
             focus:outline-none focus:ring-2 focus:ring-white/40"
      aria-label="Abrir menú"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="font-heading font-semibold text-white text-sm">We Real Estate</span>
  </div>

  <!-- Contenido: superficie propia del tema (claro/oscuro), separada del sidebar con un borde limpio -->
  <div class="relative z-0 min-h-screen bg-canvas lg:ml-64 lg:border-l lg:border-border">
    <main class="p-4 sm:p-6 lg:p-10">
      <div class="mx-auto max-w-6xl">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
